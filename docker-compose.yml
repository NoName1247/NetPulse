name: netpulse-my

services:
  edge:
    image: nginx:alpine
    container_name: netpulse-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - central
      - probe-my
      - probe-eu
    mem_limit: 32m
    oom_score_adj: 500
    networks:
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  central:
    build:
      context: .
      dockerfile: infra/Dockerfile.central
    container_name: netpulse-central
    restart: unless-stopped
    command:
      - "uvicorn"
      - "central.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "1"
      - "--loop"
      - "uvloop"
      - "--http"
      - "httptools"
      - "--no-access-log"
    env_file:
      - .env
    environment:
      PROBE_HEALTHCHECK_URLS_JSON: '{"1":"http://netpulse-edge/probe-my","2":"http://netpulse-edge/probe-eu"}'
      HEATMAP_MIN_SAMPLES: "1"
    volumes:
      - ./data/geoip:/data/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    oom_score_adj: 500
    networks:
      - app_net
      - db_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  probe-my:
    build:
      context: .
      dockerfile: infra/Dockerfile.probe
    container_name: netpulse-probe-my
    restart: unless-stopped
    environment:
      NODE_ID: "1"
      NODE_SECRET: ${NODE_1_SECRET:?NODE_1_SECRET must be set}
      MAX_FULL_SESSIONS: "50"
    mem_limit: 128m
    oom_score_adj: 500
    networks:
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  probe-eu:
    build:
      context: .
      dockerfile: infra/Dockerfile.probe
    container_name: netpulse-probe-eu
    restart: unless-stopped
    environment:
      NODE_ID: "2"
      NODE_SECRET: ${NODE_2_SECRET:?NODE_2_SECRET must be set}
      MAX_FULL_SESSIONS: "50"
    mem_limit: 128m
    oom_score_adj: 500
    networks:
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: netpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
      POSTGRES_USER: ${POSTGRES_USER:-netpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "timezone=UTC"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./central/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./central/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netpulse} -d ${POSTGRES_DB:-netpulse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    oom_score_adj: 500
    networks:
      - db_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_net:
    name: netpulse-my-app-net
  db_net:
    name: netpulse-my-db-net

volumes:
  pg_data:
    name: netpulse-my-pg-data
