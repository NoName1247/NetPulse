[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse-my"
version = "1.0.0"
description = "Crowdsourced telecom quality & outage monitor for Malaysia (Lean MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "geoip2>=4.8.0,<6.0.0",
    "h3>=4.1.0,<5.0.0",
    "structlog>=24.4.0,<26.0.0",
    "sentry-sdk[fastapi]>=2.18.0,<3.0.0",
]

[project.optional-dependencies]
probe = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "websockets>=13.1,<16.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools]
py-modules = ["shared_proto"]
packages = ["central", "probe"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]